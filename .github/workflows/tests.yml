name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install project
        run: python -m pip install -e ".[dev,solid,digitization]"
      - name: Run tests
        run: pytest -m "not integration and not external_assets"
